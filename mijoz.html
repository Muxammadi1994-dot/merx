<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERX — Mijoz portali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#E9A500;--dark:#0D1B2A;--bg:#F2F0EB;--red:#EF4444;--grn:#16A34A;--brd:#e8e5df;--white:#fff}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh}
h1,h2,h3,h4{font-family:'Sora',sans-serif}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;
  border:1.5px solid var(--brd);background:var(--white);font-family:inherit;font-size:13.5px;
  font-weight:600;cursor:pointer;transition:.15s all}
.btn:hover{opacity:.85}
.btn-acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:12.5px}
.btn-block{width:100%;justify-content:center}

/* Inputs */
input,select,textarea{font-family:inherit;font-size:14px;padding:10px 13px;
  border:1.5px solid var(--brd);border-radius:10px;width:100%;outline:none;
  background:var(--white);transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}

/* Cards */
.card{background:var(--white);border-radius:16px;border:1px solid var(--brd);overflow:hidden}

/* Badge */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge-green{background:#DCFCE7;color:#16A34A}
.badge-red{background:#FEE2E2;color:#DC2626}
.badge-yellow{background:#FEF9C3;color:#CA8A04}
.badge-blue{background:#DBEAFE;color:#1D4ED8}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--dark);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;
  z-index:9999;opacity:0;transition:.3s all;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* LOGIN */
#login-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;
  align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--white);border-radius:24px;padding:40px 32px;
  width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.1)}

/* TOP BAR */
.topbar{background:var(--dark);padding:0 20px;height:56px;display:flex;
  align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}

/* TABS */
.tabs{display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:12px;
  padding:3px;margin:0 20px}
.tab{flex:1;text-align:center;padding:8px 4px;border-radius:10px;font-size:12.5px;
  font-weight:600;cursor:pointer;color:rgba(255,255,255,.5);transition:.15s}
.tab.on{background:var(--white);color:var(--dark)}

/* MAIN */
.main{max-width:900px;margin:0 auto;padding:16px}

/* PRODUCT GRID */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media(max-width:480px){.prod-grid{grid-template-columns:repeat(2,1fr)}}
.prod-card{background:var(--white);border-radius:14px;border:1.5px solid var(--brd);
  overflow:hidden;cursor:pointer;transition:.2s all;position:relative}
.prod-card:hover{border-color:var(--acc);transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(233,165,0,.15)}
.prod-img-wrap{width:100%;aspect-ratio:1;background:#f5f2ec;
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.prod-img-wrap img{width:100%;height:100%;object-fit:cover}
.prod-img-placeholder{font-size:48px;color:#ddd}
.disc-badge{position:absolute;top:8px;right:8px;background:var(--red);
  color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
.prod-info{padding:10px 12px}
.prod-name{font-weight:700;font-size:13px;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-price{font-weight:800;font-size:14px;color:var(--acc)}
.prod-old-price{font-size:11px;color:#bbb;text-decoration:line-through;margin-left:4px}
.prod-stock{font-size:11.5px;color:#aaa;margin-top:2px}
.prod-stock.out{color:var(--red)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:none;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal-bg.on{display:flex}
.modal-box{background:var(--white);border-radius:24px 24px 0 0;
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:24px}
@media(min-width:600px){.modal-box{border-radius:24px}}
.modal-handle{width:40px;height:4px;background:#e0ddd8;border-radius:2px;
  margin:0 auto 16px}

/* TABS INNER */
.inner-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.inner-tab{padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--brd);background:var(--white);
  white-space:nowrap;transition:.15s}
.inner-tab.on{background:var(--dark);color:var(--white);border-color:var(--dark)}

/* KPI CARDS */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--white);border-radius:14px;padding:14px;border:1px solid var(--brd);text-align:center}
.kpi-val{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;margin-bottom:2px}
.kpi-lbl{font-size:11px;color:#aaa}

/* Loader */
.loader{text-align:center;padding:40px;color:#ccc;font-size:14px}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:56px;height:56px;background:var(--dark);border-radius:16px;
        display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
        font-family:'Sora',sans-serif;font-size:20px;font-weight:800;color:var(--acc)">MX</div>
      <div id="login-shop-name" style="font-size:18px;font-weight:700">MERX</div>
      <div style="font-size:13px;color:#aaa;margin-top:2px">Mijoz portali</div>
    </div>
    <div style="margin-bottom:14px">
      <label style="font-size:12px;font-weight:700;color:#888;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Telefon</label>
      <input id="l-phone" type="tel" placeholder="+998 90 123 45 67">
    </div>
    <div style="margin-bottom:20px">
      <label style="font-size:12px;font-weight:700;color:#888;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Parol</label>
      <input id="l-pass" type="password" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-acc btn-block" style="padding:13px;font-size:15px" onclick="doLogin()">
      Kirish <i class="ti ti-arrow-right"></i>
    </button>
    <div id="l-err" style="color:var(--red);font-size:13px;text-align:center;margin-top:12px;display:none"></div>
  </div>
</div>

<!-- PORTAL -->
<div id="portal-screen" style="display:none">
  <!-- Topbar -->
  <div class="topbar">
    <div>
      <div id="portal-shop-name" style="font-family:'Sora',sans-serif;font-weight:700;
        font-size:16px;color:#fff"></div>
      <div id="portal-cust-name" style="font-size:12px;color:rgba(255,255,255,.5)"></div>
    </div>
    <div class="tabs" id="main-tabs">
      <div class="tab on" onclick="goTab('katalog')"><i class="ti ti-shirt"></i> Katalog</div>
      <div class="tab" onclick="goTab('tarix')"><i class="ti ti-history"></i> Tarix</div>
      <div class="tab" onclick="goTab('bron')"><i class="ti ti-bookmark"></i> Bronlar</div>
      <div class="tab" onclick="goTab('qarz')"><i class="ti ti-credit-card"></i> Qarz</div>
    </div>
    <button class="btn btn-sm" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);
      color:#fff" onclick="doLogout()"><i class="ti ti-logout"></i></button>
  </div>

  <div class="main">

    <!-- KATALOG -->
    <div id="tab-katalog">
      <!-- Filter tabs -->
      <div class="inner-tabs" id="cat-tabs">
        <div class="inner-tab on" onclick="setCat('',this)">Barchasi</div>
        <div class="inner-tab" onclick="setCat('chegirma',this)">🔥 Chegirmalar</div>
      </div>
      <!-- Search -->
      <input id="prod-search" placeholder="🔍 Tovar qidirish..." 
        oninput="renderCatalog()" style="margin-bottom:14px">
      <!-- Grid -->
      <div class="prod-grid" id="prod-grid">
        <div class="loader"><i class="ti ti-loader"></i> Yuklanmoqda...</div>
      </div>
    </div>

    <!-- TARIX -->
    <div id="tab-tarix" style="display:none">
      <div class="kpi-row" id="tarix-kpi"></div>
      <div class="card" id="tarix-list">
        <div class="loader">Yuklanmoqda...</div>
      </div>
    </div>

    <!-- BRONLAR -->
    <div id="tab-bron" style="display:none">
      <div class="card" id="bron-list">
        <div class="loader">Yuklanmoqda...</div>
      </div>
    </div>

    <!-- QARZ -->
    <div id="tab-qarz" style="display:none">
      <div id="qarz-content">
        <div class="loader">Yuklanmoqda...</div>
      </div>
    </div>

  </div>
</div>

<!-- TOVAR DETAIL MODAL -->
<div class="modal-bg" id="prod-modal">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div id="prod-modal-content"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
let _sb       = null;
let _session  = null;
let _products = [];
let _ppProds  = [];
let _sales    = [];
let _bookings = [];
let _catFilter = "";
let _today    = new Date().toISOString().slice(0,10);

const $  = id => document.getElementById(id);
const fmt = n => Math.round(n||0).toLocaleString("ru-RU");

function toast(msg, type) {
  const el = $("toast");
  el.textContent = msg;
  el.style.background = type==="err" ? "#EF4444" : type==="warn" ? "#D97706" : "#0D1B2A";
  el.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("on"), 3000);
}

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
async function init() {
  const p      = new URLSearchParams(location.search);
  const shopId = p.get("shop") || localStorage.getItem("mp_shop") || "";
  if (!shopId) { showErr("Do'kon topilmadi"); return; }

  // Credentials
  let url, key;
  const cParam = p.get("c");
  if (cParam) {
    try {
      const d = atob(cParam);
      const parts = d.split("|||");
      url = parts[0]; key = parts[1];
      localStorage.setItem("mp_creds", JSON.stringify({url,key,shop:shopId}));
      localStorage.setItem("mp_shop", shopId);
    } catch(e) {}
  }
  if (!url || !key) {
    try {
      const sc = JSON.parse(localStorage.getItem("mp_creds")||"{}");
      if (sc.shop===shopId) { url=sc.url; key=sc.key; }
    } catch(e) {}
  }
  if (!url || !key) {
    try {
      const db = JSON.parse(localStorage.getItem("merx_v5")||"{}");
      url = db?.settings?.supabaseUrl;
      key = db?.settings?.supabaseKey;
    } catch(e) {}
  }
  if (!url || !key) { showErr("Tizimga ulaning"); return; }

  // Supabase
  try {
    _sb = supabase.createClient(url, key, {auth:{persistSession:false}});
  } catch(e) { showErr("Ulanish xatosi"); return; }

  // Shop nomi
  try {
    const {data:s} = await _sb.from("settings").select("shop_name,id").limit(5);
    if (s && s.length) {
      const found = s.find(x => String(x.id)===shopId || x.id===shopId) || s[0];
      const name = found?.shop_name || "MERX";
      if ($("login-shop-name"))  $("login-shop-name").textContent  = name;
      if ($("portal-shop-name")) $("portal-shop-name").textContent = name;
    }
  } catch(e) {}

  // Session tekshirish
  try {
    const saved = JSON.parse(localStorage.getItem("mp_session")||"null");
    if (saved && saved.shopId===shopId) {
      _session = saved;
      await startPortal();
      return;
    }
  } catch(e) {}

  // Login ko'rsat
  $("login-screen").style.display = "flex";
}

function showErr(msg) {
  document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;
    min-height:100vh;font-family:'DM Sans',sans-serif">
    <div style="text-align:center;color:#aaa">
      <div style="font-size:48px;margin-bottom:12px">⚠️</div>
      <div style="font-size:16px;color:#666">${msg}</div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════════════
async function doLogin() {
  const p      = new URLSearchParams(location.search);
  const shopId = p.get("shop") || localStorage.getItem("mp_shop") || "";
  const phone  = ($("l-phone")||{value:""}).value.trim().replace(/\s/g,"");
  const pass   = ($("l-pass")||{value:""}).value.trim();
  const errEl  = $("l-err");

  if (!phone || !pass) {
    errEl.textContent = "Telefon va parol kiriting";
    errEl.style.display = "block"; return;
  }

  try {
    const {data, error} = await _sb
      .from("portal_customers")
      .select("*")
      .eq("shop_id", shopId)
      .eq("phone", phone)
      .eq("password", pass)
      .eq("is_active", true)
      .limit(1);

    if (error || !data || !data.length) {
      errEl.textContent = "Telefon yoki parol noto'g'ri";
      errEl.style.display = "block"; return;
    }

    const row = data[0];
    // Mijoz ismini sotuvlardan olamiz
    let custName = phone;
    try {
      const {data:sd} = await _sb.from("sales")
        .select("customer_name")
        .eq("shop_id", shopId)
        .eq("customer_id", row.customer_id)
        .limit(1);
      if (sd && sd[0]?.customer_name) custName = sd[0].customer_name;
    } catch(e) {}

    _session = {customerId: row.customer_id, customerName: custName, shopId};
    localStorage.setItem("mp_session", JSON.stringify(_session));
    $("login-screen").style.display = "none";
    await startPortal();
  } catch(e) {
    errEl.textContent = "Xatolik: " + e.message;
    errEl.style.display = "block";
  }
}

function doLogout() {
  localStorage.removeItem("mp_session");
  _session = null;
  $("portal-screen").style.display = "none";
  $("login-screen").style.display = "flex";
}

// ════════════════════════════════════════════════
// PORTAL
// ════════════════════════════════════════════════
async function startPortal() {
  $("login-screen").style.display = "none";
  $("portal-screen").style.display = "block";
  if ($("portal-cust-name")) $("portal-cust-name").textContent = _session.customerName;

  // Parallel yuklash
  await Promise.all([
    loadProducts(),
    loadSales(),
    loadBookings()
  ]);
}

// ════════════════════════════════════════════════
// PRODUCTS
// ════════════════════════════════════════════════
async function loadProducts() {
  try {
    const shopId = _session.shopId;
    const {data: prods, error} = await _sb.from("products").select("*").eq("shop_id", shopId);
    if (error) { console.error("Products:", error.message); }
    _products = prods || [];

    const {data: pp} = await _sb.from("portal_products").select("*").eq("shop_id", shopId);
    _ppProds = pp || [];

    renderCatalog();
    buildCatTabs();
  } catch(e) {
    console.error("loadProducts:", e);
    $("prod-grid").innerHTML = `<div class="loader" style="color:var(--red)">Yuklanmadi: ${e.message}</div>`;
  }
}

function getProductPrice(p) {
  const pp = _ppProds.find(x => x.sku === p.sku);
  const base = pp?.portal_price || p.price_uzs || 0;
  const disc = pp?.discount || 0;
  const until = pp?.discount_until || "";
  const discActive = disc > 0 && (!until || until >= _today);
  const final = discActive ? Math.round(base * (1 - disc/100)) : base;
  return {base, disc, until, discActive, final};
}

function setCat(cat, el) {
  _catFilter = cat;
  document.querySelectorAll("#cat-tabs .inner-tab").forEach(t => t.classList.remove("on"));
  if (el) el.classList.add("on");
  renderCatalog();
}

function buildCatTabs() {
  const cats = [...new Set(_products.map(p => p.category).filter(Boolean))];
  const container = $("cat-tabs");
  if (!container) return;
  // Barchasi va Chegirma tablarini saqlab qo'shamiz
  const existing = container.innerHTML;
  cats.forEach(cat => {
    const btn = document.createElement("div");
    btn.className = "inner-tab";
    btn.textContent = cat;
    btn.onclick = () => setCat(cat, btn);
    container.appendChild(btn);
  });
}

function renderCatalog() {
  const q = ($("prod-search")||{value:""}).value.toLowerCase();
  const grid = $("prod-grid"); if (!grid) return;

  let list = _products.filter(p => {
    const pp = _ppProds.find(x => x.sku === p.sku);
    if (pp && pp.is_visible === false) return false;
    if (_catFilter === "chegirma") {
      const {discActive} = getProductPrice(p);
      return discActive;
    }
    if (_catFilter && p.category !== _catFilter) return false;
    if (q && !p.name.toLowerCase().includes(q)) return false;
    return true;
  });

  if (!list.length) {
    grid.innerHTML = `<div class="loader" style="grid-column:1/-1">
      ${q ? `"${q}" topilmadi` : _catFilter==="chegirma" ? "Chegirmali tovar yo'q" : "Tovarlar yo'q"}
    </div>`;
    return;
  }

  grid.innerHTML = list.map(p => {
    const {base, discActive, disc, until, final} = getProductPrice(p);
    const totalQty = (p.variants||[]).reduce((a,v) => a+(v.qty||0), 0);
    const variants = p.variants || [];
    const colors = [...new Set(variants.map(v=>v.color).filter(Boolean))];

    return `<div class="prod-card" onclick="openProd('${p.sku}')">
      ${discActive ? `<div class="disc-badge">−${disc}%</div>` : ""}
      <div class="prod-img-wrap">
        ${p.image
          ? `<img src="${p.image}" alt="${p.name}" loading="lazy">`
          : `<div class="prod-img-placeholder"><i class="ti ti-shoe"></i></div>`}
      </div>
      <div class="prod-info">
        <div class="prod-name">${p.name}</div>
        <div style="display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;margin-bottom:4px">
          <span class="prod-price">${fmt(final)} so'm</span>
          ${discActive ? `<span class="prod-old-price">${fmt(base)}</span>` : ""}
        </div>
        ${colors.length ? `<div style="display:flex;gap:3px;margin-bottom:4px">
          ${colors.slice(0,4).map(c => {
            const v = variants.find(x=>x.color===c);
            const hex = v?.hex || "#888";
            return `<div style="width:14px;height:14px;border-radius:50%;
              background:${hex};border:1.5px solid rgba(0,0,0,.1)" title="${c}"></div>`;
          }).join("")}
          ${colors.length > 4 ? `<span style="font-size:10px;color:#aaa">+${colors.length-4}</span>` : ""}
        </div>` : ""}
        <div class="prod-stock ${totalQty===0?'out':''}">
          ${totalQty > 0 ? `${totalQty} ta mavjud` : "Tugagan"}
        </div>
        ${discActive && until ? `<div style="font-size:10.5px;color:var(--red);margin-top:2px">⏰ ${until} gacha</div>` : ""}
      </div>
    </div>`;
  }).join("");
}

// ════════════════════════════════════════════════
// TOVAR DETAIL
// ════════════════════════════════════════════════
let _detState = {};

function openProd(sku) {
  const p = _products.find(x => x.sku === sku); if (!p) return;
  const {base, discActive, disc, until, final} = getProductPrice(p);
  const totalQty = (p.variants||[]).reduce((a,v) => a+(v.qty||0), 0);
  const colors = [...new Set((p.variants||[]).map(v=>v.color).filter(Boolean))];
  const sizes  = [...new Set((p.variants||[]).map(v=>v.size).filter(Boolean))].sort((a,b)=>{
    const n = v => parseFloat(v);
    return isNaN(n(a)) ? a.localeCompare(b) : n(a)-n(b);
  });

  _detState = {sku, color: colors[0]||"", size:"", qty:1};

  const el = $("prod-modal-content"); if (!el) return;
  el.innerHTML = `
    <!-- Rasm -->
    <div style="width:100%;aspect-ratio:1.2;border-radius:14px;overflow:hidden;
      background:#f5f2ec;display:flex;align-items:center;justify-content:center;
      margin-bottom:16px;position:relative">
      ${p.image
        ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover">`
        : `<i class="ti ti-shoe" style="font-size:64px;color:#ddd"></i>`}
      ${discActive ? `<div style="position:absolute;top:12px;right:12px;
        background:var(--red);color:#fff;font-size:13px;font-weight:700;
        padding:5px 10px;border-radius:10px">−${disc}%</div>` : ""}
    </div>

    <!-- Nom va narx -->
    <h3 style="font-size:18px;margin-bottom:6px">${p.name}</h3>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">
      <span style="font-size:22px;font-weight:800;color:${discActive?'var(--red)':'var(--acc)'}">${fmt(final)} so'm</span>
      ${discActive ? `<span style="font-size:14px;color:#bbb;text-decoration:line-through">${fmt(base)} so'm</span>` : ""}
    </div>
    ${discActive && until ? `<div style="font-size:12px;color:var(--red);margin-bottom:12px">⏰ Chegirma ${until} gacha</div>` : "<div style='margin-bottom:12px'></div>"}

    <!-- Qolgan zaxira -->
    <div style="font-size:13px;color:#aaa;margin-bottom:16px">
      ${totalQty > 0
        ? `✅ ${totalQty} ta mavjud`
        : `<span style="color:var(--red)">❌ Tugagan</span>`}
    </div>

    ${colors.length ? `
    <!-- Rang -->
    <div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:#888;margin-bottom:8px;
        text-transform:uppercase;letter-spacing:.5px">Rang</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="color-opts">
        ${colors.map(c => {
          const v = (p.variants||[]).find(x=>x.color===c);
          const hex = v?.hex||"#888";
          const qty = (p.variants||[]).filter(x=>x.color===c).reduce((a,x)=>a+x.qty,0);
          return `<div onclick="setColor('${c}',this)"
            style="display:flex;align-items:center;gap:6px;padding:6px 12px;
              border-radius:10px;border:2px solid ${c===_detState.color?'var(--dark)':'var(--brd)'};
              cursor:pointer;font-size:13px;font-weight:500;transition:.15s;
              ${qty===0?'opacity:.4':''}">
            <div style="width:16px;height:16px;border-radius:50%;background:${hex};
              border:1.5px solid rgba(0,0,0,.1)"></div>
            ${c}
          </div>`;
        }).join("")}
      </div>
    </div>` : ""}

    ${sizes.length ? `
    <!-- O'lcham -->
    <div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:#888;margin-bottom:8px;
        text-transform:uppercase;letter-spacing:.5px">O'lcham</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap" id="size-opts">
        ${sizes.map(s => {
          const qty = (p.variants||[]).filter(x=>x.size===s).reduce((a,x)=>a+x.qty,0);
          return `<div onclick="${qty>0?`setSize('${s}',this)`:''}"
            style="min-width:44px;text-align:center;padding:8px 10px;
              border-radius:10px;border:2px solid var(--brd);
              cursor:${qty>0?'pointer':'default'};font-weight:600;font-size:13px;
              transition:.15s;${qty===0?'opacity:.35;background:#f5f5f5':''}">
            ${s}
          </div>`;
        }).join("")}
      </div>
    </div>` : ""}

    <!-- Miqdor -->
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px">Miqdor</div>
      <div style="display:flex;align-items:center;gap:0;border:1.5px solid var(--brd);border-radius:10px;overflow:hidden">
        <button onclick="detQty(-1)" style="width:40px;height:40px;border:none;background:none;
          cursor:pointer;font-size:20px;font-weight:300;color:#666">−</button>
        <span id="det-qty" style="min-width:36px;text-align:center;font-weight:700;font-size:16px">1</span>
        <button onclick="detQty(1)" style="width:40px;height:40px;border:none;background:none;
          cursor:pointer;font-size:20px;font-weight:300;color:#666">+</button>
      </div>
    </div>

    <!-- Izoh -->
    <textarea id="det-note" placeholder="Izoh qoldiring (ixtiyoriy)" rows="2"
      style="margin-bottom:14px;resize:none"></textarea>

    <!-- Bron tugmasi -->
    <button class="btn btn-acc btn-block" style="padding:14px;font-size:15px"
      onclick="submitBron('${sku}')" ${totalQty===0?'disabled style="opacity:.5"':''}>
      <i class="ti ti-bookmark"></i>
      ${totalQty > 0 ? "Bron qilish" : "Tugagan"}
    </button>

    <!-- Ulashish -->
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-sm" style="flex:1" onclick="shareProd('${sku}')">
        <i class="ti ti-share"></i> Ulashish
      </button>
      <button class="btn btn-sm" style="flex:1" onclick="closeProdModal()">
        Yopish
      </button>
    </div>
  `;

  $("prod-modal").classList.add("on");
}

function setColor(color, el) {
  _detState.color = color;
  document.querySelectorAll("#color-opts > div").forEach(d => {
    d.style.borderColor = "var(--brd)";
  });
  el.style.borderColor = "var(--dark)";
}

function setSize(size, el) {
  _detState.size = size;
  document.querySelectorAll("#size-opts > div").forEach(d => {
    if (!d.style.opacity || d.style.opacity === "1") d.style.borderColor = "var(--brd)";
  });
  el.style.borderColor = "var(--dark)";
}

function detQty(d) {
  _detState.qty = Math.max(1, (_detState.qty||1) + d);
  if ($("det-qty")) $("det-qty").textContent = _detState.qty;
}

function closeProdModal() {
  $("prod-modal").classList.remove("on");
}

// Tashqariga bosib yopish
$("prod-modal").addEventListener("click", e => {
  if (e.target === $("prod-modal")) closeProdModal();
});

function shareProd(sku) {
  const p = _products.find(x => x.sku===sku); if (!p) return;
  const {final} = getProductPrice(p);
  const txt = `${p.name} — ${fmt(final)} so'm\n${location.href}`;
  if (navigator.share) {
    navigator.share({title:p.name, text:txt, url:location.href});
  } else {
    navigator.clipboard?.writeText(txt);
    toast("Nusxa olindi!");
  }
}

// ════════════════════════════════════════════════
// BRON
// ════════════════════════════════════════════════
async function submitBron(sku) {
  if (!_session) return;
  const p = _products.find(x => x.sku===sku); if (!p) return;
  const note = ($("det-note")||{value:""}).value.trim();
  const shopId = _session.shopId;

  try {
    const id = shopId + "_b_" + Date.now();
    const {error} = await _sb.from("portal_bookings").insert({
      id,
      shop_id:      shopId,
      customer_id:  _session.customerId,
      sku,
      product_name: p.name,
      color:        _detState.color || "",
      size:         _detState.size  || "",
      qty:          _detState.qty   || 1,
      note:         note || null,
      status:       "kutilmoqda"
    });
    if (error) throw error;
    toast("✅ Bron qabul qilindi! Do'kon tasdiqlaydi.");
    closeProdModal();
    await loadBookings();
    goTab("bron");
  } catch(e) {
    toast("Xato: " + e.message, "err");
  }
}

async function loadBookings() {
  if (!_session || !_sb) return;
  try {
    const {data} = await _sb.from("portal_bookings")
      .select("*")
      .eq("shop_id", _session.shopId)
      .eq("customer_id", _session.customerId)
      .order("created_at", {ascending:false})
      .limit(30);
    _bookings = data || [];
    renderBookings();
  } catch(e) {}
}

function renderBookings() {
  const el = $("bron-list"); if (!el) return;
  if (!_bookings.length) {
    el.innerHTML = `<div class="loader">Bronlar yo'q</div>`;
    return;
  }
  const statusLabel = {kutilmoqda:"⏳ Kutilmoqda", tasdiqlandi:"✅ Tasdiqlandi", bekor:"❌ Bekor"};
  const statusClass = {kutilmoqda:"badge-yellow", tasdiqlandi:"badge-green", bekor:"badge-red"};

  el.innerHTML = _bookings.map(b => `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;
      padding:14px 16px;border-bottom:1px solid var(--brd)">
      <div>
        <div style="font-weight:700;font-size:14px">${b.product_name}</div>
        <div style="font-size:12.5px;color:#aaa;margin-top:2px">
          ${[b.color,b.size].filter(Boolean).join(" · ")} · ${b.qty} ta
        </div>
        ${b.note ? `<div style="font-size:12px;color:#D97706;margin-top:3px">💬 ${b.note}</div>` : ""}
        <div style="font-size:11px;color:#ccc;margin-top:4px">${(b.created_at||"").slice(0,16)}</div>
      </div>
      <span class="badge ${statusClass[b.status]||'badge-yellow'}" style="white-space:nowrap;margin-left:12px">
        ${statusLabel[b.status]||b.status}
      </span>
    </div>
  `).join("");
}

// ════════════════════════════════════════════════
// TARIX & QARZ
// ════════════════════════════════════════════════
async function loadSales() {
  if (!_session || !_sb) return;
  try {
    const {data} = await _sb.from("sales")
      .select("*")
      .eq("shop_id", _session.shopId)
      .eq("customer_id", _session.customerId)
      .order("date", {ascending:false});
    _sales = data || [];
    renderTarix();
    renderQarz();
  } catch(e) {}
}

function renderTarix() {
  const kpiEl = $("tarix-kpi");
  const listEl = $("tarix-list");
  if (!kpiEl || !listEl) return;

  const total  = _sales.reduce((a,s) => a+(s.total||0), 0);
  const paid   = _sales.reduce((a,s) => a+(s.paid||0), 0);
  const debt   = _sales.filter(s=>s.remaining>0).reduce((a,s) => a+(s.remaining||0), 0);

  kpiEl.innerHTML = `
    <div class="kpi">
      <div class="kpi-val">${_sales.length}</div>
      <div class="kpi-lbl">Jami xarid</div>
    </div>
    <div class="kpi">
      <div class="kpi-val" style="font-size:14px">${fmt(total)}</div>
      <div class="kpi-lbl">Jami summa</div>
    </div>
    <div class="kpi">
      <div class="kpi-val" style="font-size:14px;color:${debt?'var(--red)':'var(--grn)'}">${debt?fmt(debt):0}</div>
      <div class="kpi-lbl">Qarz</div>
    </div>
  `;

  if (!_sales.length) {
    listEl.innerHTML = `<div class="loader">Xarid tarixi yo'q</div>`;
    return;
  }

  listEl.innerHTML = _sales.map(s => {
    const items = (s.items||[]).filter(Boolean);
    const isDebt = s.status==="qarz" && s.remaining>0;
    return `<div style="padding:14px 16px;border-bottom:1px solid var(--brd)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div>
          <div style="font-weight:700;font-size:15px">${fmt(s.total)} so'm</div>
          <div style="font-size:12px;color:#aaa">${s.date||""} ${s.time||""}</div>
        </div>
        <span class="badge ${isDebt?'badge-red':s.status==='qaytarilgan'?'badge-yellow':'badge-green'}">
          ${isDebt?"Qarzda":s.status==="qaytarilgan"?"Qaytarilgan":"✅ To'langan"}
        </span>
      </div>
      <div style="font-size:13px;color:#666;margin-bottom:${isDebt?'6px':'0'}">
        ${items.map(i=>`${i.name} ×${i.qty}`).join(", ")||"—"}
      </div>
      ${isDebt ? `<div style="font-size:13px;color:var(--red);font-weight:600">
        Qarz: ${fmt(s.remaining)} so'm
        ${s.due ? `<span style="font-weight:400;color:#D97706"> · muddat: ${s.due}</span>` : ""}
      </div>` : ""}
    </div>`;
  }).join("");
}

function renderQarz() {
  const el = $("qarz-content"); if (!el) return;
  const debts = _sales.filter(s => s.status==="qarz" && s.remaining>0);
  const total = debts.reduce((a,s) => a+(s.remaining||0), 0);

  if (!debts.length) {
    el.innerHTML = `<div class="card" style="text-align:center;padding:40px">
      <div style="font-size:48px;margin-bottom:12px">✅</div>
      <div style="font-size:16px;font-weight:700;color:var(--grn)">Qarz yo'q</div>
      <div style="font-size:13px;color:#aaa;margin-top:4px">Barcha to'lovlar amalga oshirilgan</div>
    </div>`;
    return;
  }

  el.innerHTML = `
    <div style="background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff;
      border-radius:16px;padding:20px;margin-bottom:14px;text-align:center">
      <div style="font-size:13px;opacity:.8;margin-bottom:4px">Jami qarz</div>
      <div style="font-size:28px;font-weight:800">${fmt(total)} so'm</div>
    </div>
    <div class="card">
      ${debts.map(s => `
        <div style="padding:14px 16px;border-bottom:1px solid var(--brd)">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <div style="font-size:13px;color:#666">${s.date||""}</div>
            <div style="font-weight:700;color:var(--red)">${fmt(s.remaining)} so'm</div>
          </div>
          <div style="font-size:13px;color:#666">
            ${(s.items||[]).filter(Boolean).map(i=>i.name).join(", ")||"—"}
          </div>
          ${s.due ? `<div style="font-size:12px;color:#D97706;margin-top:3px">⏰ Muddat: ${s.due}</div>` : ""}
        </div>
      `).join("")}
    </div>
  `;
}

// ════════════════════════════════════════════════
// TAB
// ════════════════════════════════════════════════
function goTab(name) {
  ["katalog","tarix","bron","qarz"].forEach(t => {
    $("tab-"+t).style.display = t===name ? "block" : "none";
  });
  document.querySelectorAll(".tab").forEach((t,i) => {
    t.classList.toggle("on", ["katalog","tarix","bron","qarz"][i]===name);
  });
}

// ════════════════════════════════════════════════
// START
// ════════════════════════════════════════════════
init();
</script>
</body>
</html>
