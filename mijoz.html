<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MERX — Mijoz portali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --acc:#E9A500;--dark:#0D1B2A;--dark2:#162336;
  --bg:#F2F0EB;--red:#EF4444;--grn:#16A34A;
  --brd:#e8e5df;--white:#fff;
  --shadow:0 2px 12px rgba(0,0,0,.07);
  --shadow-md:0 4px 20px rgba(0,0,0,.1);
  --shadow-lg:0 8px 32px rgba(0,0,0,.14);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;overscroll-behavior:none}
h1,h2,h3{font-family:'Sora',sans-serif}

/* BASE */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:12px;border:1.5px solid var(--brd);background:var(--white);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;text-decoration:none;-webkit-user-select:none}
.btn:active{transform:scale(.96)}
.btn-acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-ghost{background:none;border-color:transparent}
.btn-block{width:100%}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:10px}

input,select,textarea{font-family:inherit;font-size:14px;padding:12px 14px;border:1.5px solid var(--brd);border-radius:12px;width:100%;outline:none;background:var(--white);transition:.15s;-webkit-appearance:none;color:var(--dark)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(233,165,0,.12)}
input::placeholder{color:#bbb}

.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.bg-green{background:#DCFCE7;color:#16A34A}
.bg-red{background:#FEE2E2;color:#DC2626}
.bg-yellow{background:#FEF9C3;color:#B45309}
.bg-orange{background:#FEF3C7;color:#D97706}
.bg-gray{background:#F3F4F6;color:#6B7280}
.bg-blue{background:#DBEAFE;color:#1D4ED8}

/* TOAST */
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--dark);color:#fff;padding:13px 22px;border-radius:14px;font-size:13.5px;z-index:9999;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* LOGIN */
#login-screen{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#0a1628 0%,#0D1B2A 50%,#122034 100%);z-index:100;align-items:center;justify-content:center;padding:20px}
.lbox{background:var(--white);border-radius:28px;padding:36px 28px;width:100%;max-width:380px;box-shadow:0 32px 80px rgba(0,0,0,.45)}
.llogo{width:64px;height:64px;background:var(--dark);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-family:'Sora',sans-serif;font-size:22px;font-weight:800;color:var(--acc)}
.llabel{font-size:11px;font-weight:800;color:#999;display:block;margin-bottom:7px;text-transform:uppercase;letter-spacing:.6px}

/* TOPBAR */
.topbar{background:var(--dark);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 16px rgba(0,0,0,.2)}
/* 2026-07-20: kompyuterda portal markazda, tor (mobil ilovadek) — juda keng cho'zilmasin */
#portal-screen{max-width:640px;margin:0 auto;position:relative;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.06)}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:var(--white);border-top:1px solid var(--brd);display:flex;z-index:50;box-shadow:0 -4px 20px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom,0)}
.bi{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 12px;gap:3px;cursor:pointer;font-size:10px;font-weight:800;color:#ccc;transition:.15s;position:relative;text-transform:uppercase;letter-spacing:.3px}
.bi.on{color:var(--acc)}
.bi.on i{color:var(--acc)}
.bi i{font-size:22px;color:#ccc;transition:.15s}
.bbadge{position:absolute;top:7px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--white)}

/* MAIN */
.main{max-width:640px;margin:0 auto;padding:14px 14px 96px}

/* CHIPS */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:22px;font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--brd);background:var(--white);white-space:nowrap;transition:.15s;flex-shrink:0}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.chip:active{transform:scale(.95)}

/* SEARCH */
.sbox{position:relative;margin-bottom:12px}
.sbox i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#bbb;font-size:18px;pointer-events:none}
.sbox input{padding-left:44px}

/* PRODUCT GRID */
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:460px){.pg{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--white);border-radius:18px;border:1.5px solid var(--brd);overflow:hidden;cursor:pointer;transition:.2s;position:relative;box-shadow:var(--shadow)}
.pc:active{transform:scale(.96)}
.pimg{width:100%;aspect-ratio:1;background:#f0ede8;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.pimg img{width:100%;height:100%;object-fit:cover}
.dbadge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px}
.pinfo{padding:10px 12px 14px}
.pname{font-weight:700;font-size:13px;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.pprice{font-weight:800;font-size:15px;color:var(--acc);font-family:'Sora',sans-serif}
.pold{font-size:11px;color:#ccc;text-decoration:line-through;margin-left:4px}
.pmeta{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.pstock{font-size:11px;color:#aaa;font-weight:600}
.pstock.out{color:var(--red)}

/* PRODUCT LIST VIEW */
.pl{display:flex;flex-direction:column;gap:10px}
.plc{background:var(--white);border-radius:14px;border:1.5px solid var(--brd);overflow:hidden;cursor:pointer;display:flex;box-shadow:var(--shadow)}
.plc:active{transform:scale(.99)}
.plimg{width:88px;height:88px;flex-shrink:0;background:#f0ede8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.plimg img{width:100%;height:100%;object-fit:cover}
.plinfo{flex:1;padding:12px 14px;min-width:0}

/* BOTTOM SHEET */
.sbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sbg.on{display:flex}
.sheet{background:var(--white);border-radius:28px 28px 0 0;width:100%;max-width:640px;max-height:94vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,16px)}
.shandle{width:44px;height:4px;background:#e0ddd8;border-radius:2px;margin:14px auto 0}
.sbody{padding:16px 20px 28px}

/* KPI */
.krow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--white);border-radius:16px;padding:14px 10px;border:1px solid var(--brd);text-align:center;box-shadow:var(--shadow)}
.kval{font-family:'Sora',sans-serif;font-size:16px;font-weight:800;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.klbl{font-size:10px;color:#aaa;font-weight:800;text-transform:uppercase;letter-spacing:.4px}

/* SALE CARD */
.sc{background:var(--white);border-radius:16px;border:1px solid var(--brd);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}

/* DEBT HERO */
.dhero{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff;border-radius:20px;padding:24px;margin-bottom:16px;text-align:center;box-shadow:0 8px 24px rgba(239,68,68,.3)}

/* EMPTY */
.empty{text-align:center;padding:52px 20px}
.empty i{font-size:52px;display:block;margin-bottom:14px;color:#ddd}
.etitle{font-size:15px;font-weight:700;color:#bbb;margin-bottom:6px}
.esub{font-size:13px;color:#ccc}

/* SECTION LABEL */
.slbl{font-size:11px;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}

/* COLOR DOT */
.cdot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.1);flex-shrink:0}

/* SIZE CHIP */
.sch{min-width:46px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:11px;border:2px solid var(--brd);font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.sch.on{border-color:var(--dark);background:var(--dark);color:#fff}
.sch.out{opacity:.3;cursor:default;background:#f5f5f5}

/* QTY */
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--brd);border-radius:14px;overflow:hidden}
.qbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;font-size:24px;font-weight:300;color:#555;line-height:1}
.qbtn:active{background:#f5f2eb}
.qnum{min-width:40px;text-align:center;font-weight:800;font-size:17px;font-family:'Sora',sans-serif}

/* VARIANT TABLE */
.vtable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.vtable th{background:#f5f2eb;padding:7px 10px;text-align:left;font-weight:700;color:#888;font-size:11px;text-transform:uppercase}
.vtable td{padding:7px 10px;border-top:1px solid var(--brd);color:#444}
.vtable tr:last-child td{border-bottom:1px solid var(--brd)}

/* SKELETON */
.skel{background:linear-gradient(90deg,#f0ede8 25%,#e8e5e0 50%,#f0ede8 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;display:inline-block}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
/* ═══ BOSH SAHIFA (dashboard) — 2026-07-20 ═══ */
#tab-bosh{animation:boshIn .3s ease}
@keyframes boshIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bosh-hero{background:linear-gradient(135deg,#0D1B2A,#1e3a5f);border-radius:20px;padding:22px;margin-bottom:14px;color:#fff;box-shadow:0 8px 28px rgba(13,27,42,.28)}
.bosh-hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bosh-salom{font-size:14px;opacity:.7}
.bosh-name{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;margin-top:2px}
.bosh-pts{display:flex;align-items:center;gap:9px;background:rgba(233,165,0,.18);border:1px solid rgba(233,165,0,.35);border-radius:14px;padding:10px 14px}
.bosh-pts i{font-size:22px;color:#E9A500}
.bosh-pts-val{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;color:#E9A500;line-height:1}
.bosh-pts-lbl{font-size:10px;opacity:.7;margin-top:1px}
.bosh-debt{background:linear-gradient(135deg,#FEF2F2,#FEE2E2);border:1.5px solid #FECACA;border-radius:16px;padding:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.15s}
.bosh-debt:active{transform:scale(.98)}
.bosh-debt-l{display:flex;align-items:center;gap:13px}
.bosh-debt-ico{width:46px;height:46px;border-radius:13px;background:#EF4444;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.bosh-debt-lbl{font-size:12px;color:#B91C1C;font-weight:600}
.bosh-debt-val{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;color:#991B1B;line-height:1.2}
.bosh-debt-sub{font-size:11.5px;color:#DC2626;opacity:.8}
.bosh-nodebt{background:#F0FDF4;border:1.5px solid #BBF7D0;border-radius:14px;padding:13px;margin-bottom:14px;color:#16A34A;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.bosh-nodebt i{font-size:18px}
.bosh-stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.bosh-stat{background:#fff;border:1px solid var(--brd);border-radius:16px;padding:15px;box-shadow:var(--shadow)}
.bosh-stat-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:9px}
.bosh-stat-val{font-family:'Sora',sans-serif;font-size:21px;font-weight:800;line-height:1}
.bosh-stat-lbl{font-size:12px;color:#8a8a8a;margin-top:3px}
.bosh-quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.bosh-q{background:#fff;border:1px solid var(--brd);border-radius:15px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.bosh-q:active{transform:scale(.96)}
.bosh-q-ico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px}
.bosh-q span{font-size:12px;font-weight:600;color:var(--dark);text-align:center}
.bosh-sec{margin-bottom:18px}
.bosh-sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.bosh-sec-head span{font-family:'Sora',sans-serif;font-size:16px;font-weight:700}
.bosh-sec-head a{font-size:13px;color:var(--acc);font-weight:600;cursor:pointer}
.bosh-sale{background:#fff;border:1px solid var(--brd);border-radius:14px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.bosh-sale-l{display:flex;align-items:center;gap:11px}
.bosh-sale-ico{width:40px;height:40px;border-radius:11px;background:#F3F4F6;color:#6B7280;display:flex;align-items:center;justify-content:center;font-size:19px}
.bosh-sale-num{font-weight:700;font-size:14px}
.bosh-sale-dt{font-size:12px;color:#9ca3af}
.bosh-sale-r{text-align:right}
.bosh-sale-tot{font-family:'Sora',sans-serif;font-weight:700;font-size:14.5px}
.bosh-sale-debt{font-size:11.5px;color:#DC2626;font-weight:600}
.bosh-sale-paid{font-size:11.5px;color:#16A34A;font-weight:600}
.bosh-newgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.bosh-new{cursor:pointer;transition:.15s}
.bosh-new:active{transform:scale(.96)}
.bosh-new-img{aspect-ratio:1;background:#f4f2ee;border-radius:13px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:7px;border:1px solid var(--brd)}
.bosh-new-img img{width:100%;height:100%;object-fit:cover}
.bosh-new-img i{font-size:28px;color:#c9c5bd}
.bosh-new-name{font-size:12.5px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:2px}
.bosh-new-price{font-size:12.5px;font-weight:700;color:var(--acc)}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="lbox">
    <div class="llogo">MX</div>
    <div style="text-align:center;margin-bottom:28px">
      <div id="lshop" style="font-size:19px;font-weight:800;font-family:'Sora',sans-serif">MERX</div>
      <div style="font-size:13px;color:#aaa;margin-top:4px">Mijoz portali</div>
    </div>
    <label class="llabel">Telefon</label>
    <input id="lphone" type="tel" placeholder="+998 90 123 45 67" autocomplete="tel" style="margin-bottom:12px">
    <label class="llabel">Parol</label>
    <div style="position:relative;margin-bottom:20px">
      <input id="lpass" type="password" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()">
      <button onclick="togglePass()" class="btn btn-ghost" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:6px;color:#bbb">
        <i class="ti ti-eye" id="peye" style="font-size:18px"></i>
      </button>
    </div>
    <button class="btn btn-acc btn-block" style="padding:14px;font-size:15px;border-radius:14px" onclick="doLogin()" id="lbtn">
      <i class="ti ti-login"></i> Kirish
    </button>
    <div id="lerr" style="display:none;color:var(--red);font-size:13px;text-align:center;margin-top:12px;padding:10px;background:#FEF2F2;border-radius:10px;font-weight:600"></div>
    <div style="text-align:center;margin-top:16px;font-size:12.5px;color:#aaa">
      Muammo bo'lsa do'kon egasiga murojaat qiling
    </div>
  </div>
</div>

<!-- PORTAL -->
<div id="portal-screen" style="display:none">
  <div class="topbar">
    <div style="min-width:0;flex:1">
      <div id="tshop" style="font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px"></div>
      <div id="tuser" style="font-size:11.5px;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:3px;margin-top:1px">
        <i class="ti ti-user" style="font-size:11px"></i><span></span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <div id="dpill" style="display:none;background:var(--red);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;display:none;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(239,68,68,.35)" onclick="goTab('qarz')">
        <i class="ti ti-alert-circle" style="font-size:14px"></i><span id="dpilltxt"></span>
      </div>
      <button onclick="doLogout()" style="width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center">
        <i class="ti ti-logout" style="font-size:17px"></i>
      </button>
    </div>
  </div>

  <div class="main">
    <!-- BOSH SAHIFA (dashboard) -->
    <div id="tab-bosh">
      <div id="bosh-cont"></div>
    </div>

    <!-- KATALOG -->
    <div id="tab-katalog" style="display:none">
      <div class="chips" id="cchips">
        <div class="chip on" onclick="setCat('',this)">Barchasi</div>
        <div class="chip" onclick="setCat('chegirma',this)">🔥 Chegirmalar</div>
      </div>
      <div class="sbox">
        <i class="ti ti-search"></i>
        <input id="psearch" placeholder="Tovar qidirish..." oninput="renderCatalog()" autocomplete="off">
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:12px;color:#aaa;font-weight:600" id="pcnt"></div>
        <div style="display:flex;align-items:center;gap:8px">
          <select id="psort" onchange="renderCatalog()" style="width:auto;padding:7px 10px;font-size:12px;font-weight:600;border-radius:10px;cursor:pointer;border-color:var(--brd)">
            <option value="">Standart</option>
            <option value="asc">Narx ↑</option>
            <option value="desc">Narx ↓</option>
            <option value="az">Nomi A-Z</option>
            <option value="stock">Ko'p zaxira</option>
          </select>
          <button id="vbtn" onclick="toggleView()" style="width:36px;height:36px;border-radius:10px;border:1.5px solid var(--brd);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center">
            <i class="ti ti-layout-list" id="vicon" style="font-size:18px;color:#888"></i>
          </button>
        </div>
      </div>
      <div id="pgrid">
        <div class="pg">${[1,2,3,4].map(()=>`<div><div class="skel" style="aspect-ratio:1;border-radius:18px;margin-bottom:8px"></div><div class="skel" style="height:13px;border-radius:6px;margin-bottom:5px;width:75%"></div><div class="skel" style="height:15px;border-radius:6px;width:55%"></div></div>`).join('')}</div>
      </div>
    </div>

    <!-- TARIX -->
    <div id="tab-tarix" style="display:none">
      <div class="krow" id="tkpi"></div>
      <div class="chips">
        <div class="chip on" onclick="setTF('all',this)">Barchasi</div>
        <div class="chip" onclick="setTF('tolandi',this)">✅ To'langan</div>
        <div class="chip" onclick="setTF('qarz',this)">⏳ Qarzda</div>
      </div>
      <div id="tlist"></div>
    </div>

    <!-- BRONLAR -->
    <div id="tab-bron" style="display:none">
      <div class="chips">
        <div class="chip on" onclick="setBF('all',this)">Barchasi</div>
        <div class="chip" onclick="setBF('kutilmoqda',this)">⏳ Kutilmoqda</div>
        <div class="chip" onclick="setBF('tasdiqlandi',this)">✅ Tasdiqlandi</div>
        <div class="chip" onclick="setBF('bekor',this)">❌ Bekor</div>
      </div>
      <div id="blist"></div>
    </div>

    <!-- QARZ -->
    <div id="tab-qarz" style="display:none">
      <div id="qcont"></div>
    </div>

    <!-- PROFIL -->
    <div id="tab-profil" style="display:none">
      <div id="profcont" style="padding:16px"></div>
    </div>
  </div>

  <div class="bnav">
    <div class="bi on" id="nav-bosh" onclick="goTab('bosh')"><i class="ti ti-home"></i><span>Bosh</span></div>
    <div class="bi" id="nav-katalog" onclick="goTab('katalog')"><i class="ti ti-shirt"></i><span>Katalog</span></div>
    <div class="bi" id="nav-tarix" onclick="goTab('tarix')"><i class="ti ti-receipt"></i><span>Tarix</span></div>
    <div class="bi" id="nav-bron" onclick="goTab('bron')"><i class="ti ti-bookmark"></i><span>Bronlar</span><div class="bbadge" id="bbadge" style="display:none">0</div></div>
    <div class="bi" id="nav-qarz" onclick="goTab('qarz')"><i class="ti ti-credit-card"></i><span>Qarz</span><div class="bbadge" id="qbadge" style="display:none">!</div></div>
    <div class="bi" id="nav-profil" onclick="goTab('profil')"><i class="ti ti-user"></i><span>Profil</span></div>
  </div>
</div>

<!-- DETAIL SHEET -->
<div class="sbg" id="dsheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheet"><div class="shandle"></div><div class="sbody" id="dsbody"></div></div>
</div>

<script>
let _sb=null,_sess=null;
let _prods=[],_pp=[],_sales=[],_brons=[];
let _cat="",_tf="all",_bf="all",_viewList=false;
const _today=new Date().toISOString().slice(0,10);
let _det={};

const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n||0).toLocaleString("ru-RU");

function toast(msg,t){
  const el=$("toast");el.textContent=msg;
  el.style.background=t==="err"?"#EF4444":t==="grn"?"#16A34A":t==="warn"?"#D97706":"#0D1B2A";
  el.classList.add("on");clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove("on"),3200);
}

function togglePass(){
  const i=$("lpass"),e=$("peye");
  i.type=i.type==="password"?"text":"password";
  e.className=i.type==="text"?"ti ti-eye-off":"ti ti-eye";
}

// ── INIT ──────────────────────────────────────
async function init(){
  const p=new URLSearchParams(location.search);
  const sid=p.get("shop")||localStorage.getItem("mp_shop")||"";
  if(!sid){showErr("Do'kon topilmadi. Yangi link so'rang.");return;}

  let url,key;
  const c=p.get("c");
  if(c){try{const d=atob(c),pts=d.split("|||");url=pts[0];key=pts[1];localStorage.setItem("mp_creds",JSON.stringify({url,key,shop:sid}));localStorage.setItem("mp_shop",sid);}catch(e){}}
  if(!url||!key){try{const s=JSON.parse(localStorage.getItem("mp_creds")||"{}");if(s.shop===sid){url=s.url;key=s.key;}}catch(e){}}
  if(!url||!key){try{const d=JSON.parse(localStorage.getItem("merx_v5")||"{}");url=d?.settings?.supabaseUrl;key=d?.settings?.supabaseKey;}catch(e){}}
  if(!url||!key){showErr("Ulanib bo'lmadi. Do'kon egasidan link so'rang.");return;}

  try{_sb=supabase.createClient(url,key,{auth:{persistSession:false}});}
  catch(e){showErr("Ulanish xatosi");return;}

  try{
    const{data:sa}=await _sb.from("settings").select("shop_name").eq("shop_id",sid).limit(1);
    const nm=sa?.[0]?.shop_name||"MERX";
    $("lshop").textContent=nm;$("tshop").textContent=nm;document.title=nm+" — Mijoz portali";
  }catch(e){}

  try{
    const sv=JSON.parse(localStorage.getItem("mp_session")||"null");
    if(sv&&sv.shopId===sid){_sess=sv;await startPortal();return;}
  }catch(e){}

  $("login-screen").style.display="flex";
}

function showErr(msg){
  document.body.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'DM Sans',sans-serif;background:var(--bg);padding:20px"><div style="text-align:center"><div style="font-size:56px;margin-bottom:16px">⚠️</div><div style="font-size:16px;font-weight:700;color:#444;margin-bottom:8px">Muammo yuz berdi</div><div style="font-size:14px;color:#aaa;max-width:280px;line-height:1.6;margin:0 auto">${msg}</div></div></div>`;
}

// ── LOGIN ─────────────────────────────────────
async function doLogin(){
  const p=new URLSearchParams(location.search);
  const sid=p.get("shop")||localStorage.getItem("mp_shop")||"";
  const ph=($("lphone")||{value:""}).value.trim().replace(/\s/g,"");
  const pw=($("lpass")||{value:""}).value.trim();
  const err=$("lerr"),btn=$("lbtn");
  if(!ph||!pw){err.textContent="Telefon va parol kiriting";err.style.display="block";return;}
  err.style.display="none";
  btn.innerHTML='<i class="ti ti-loader spin"></i> Tekshirilmoqda...';btn.disabled=true;
  try{
    const{data,error}=await _sb.from("portal_customers").select("*")
      .eq("shop_id",sid).eq("phone",ph).eq("password",pw).eq("is_active",true).limit(1);
    btn.innerHTML='<i class="ti ti-login"></i> Kirish';btn.disabled=false;
    if(error||!data?.length){err.textContent="Telefon yoki parol noto'g'ri";err.style.display="block";return;}
    const row=data[0];
    let nm=ph;
    try{const{data:sd}=await _sb.from("sales").select("customer_name").eq("shop_id",sid).eq("customer_id",row.customer_id).limit(1);if(sd?.[0]?.customer_name)nm=sd[0].customer_name;}catch(e){}
    _sess={customerId:row.customer_id,customerName:nm,shopId:sid,phone:ph,
      loyaltyPoints:row.loyalty_points||0,
      birthday:row.birthday||"",
      loyaltyRate:row.loyalty_rate||0};
    localStorage.setItem("mp_session",JSON.stringify(_sess));
    $("login-screen").style.display="none";
    await startPortal();
  }catch(e){
    btn.innerHTML='<i class="ti ti-login"></i> Kirish';btn.disabled=false;
    err.textContent="Xatolik: "+e.message;err.style.display="block";
  }
}

function logout(){ doLogout(); }
function doLogout(){
  if(!confirm("Chiqishni xohlaysizmi?"))return;
  localStorage.removeItem("mp_session");
  _sess=null;_prods=[];_pp=[];_sales=[];_brons=[];
  $("portal-screen").style.display="none";$("login-screen").style.display="flex";
}

// ── PORTAL ────────────────────────────────────
async function startPortal(){
  $("login-screen").style.display="none";$("portal-screen").style.display="block";
  $("tshop") && ($("tshop").textContent = _sess.shopId ? $("tshop").textContent : "MERX");
  const tu=$("tuser");if(tu){const sp=tu.querySelector("span");if(sp)sp.textContent=_sess.customerName;}
  await Promise.all([loadProds(),loadSales(),loadBrons()]);
  updateBadges();
  goTab("bosh");
}

function updateBadges(){
  const debt=_sales.filter(s=>s.status==="qarz"&&s.remaining>0).reduce((a,s)=>a+(s.remaining||0),0);
  const dp=$("dpill"),dpt=$("dpilltxt");
  if(debt>0){if(dp)dp.style.display="flex";if(dpt)dpt.textContent=fmt(debt)+" so'm";}
  else if(dp)dp.style.display="none";
  const qb=$("qbadge");if(qb)qb.style.display=debt>0?"flex":"none";
  const pending=_brons.filter(b=>b.status==="kutilmoqda").length;
  const bb=$("bbadge");if(bb){bb.textContent=pending;bb.style.display=pending>0?"flex":"none";}
}

// ── PRODUCTS ──────────────────────────────────
async function loadProds(){
  try{
    const{data:pr,error}=await _sb.from("products").select("*").eq("shop_id",_sess.shopId);
    if(error)throw error;
    _prods=pr||[];
    const{data:pp}=await _sb.from("portal_products").select("*").eq("shop_id",_sess.shopId);
    _pp=pp||[];
    renderCatalog();buildCatChips();
  }catch(e){
    $("pgrid").innerHTML=`<div class="empty"><i class="ti ti-wifi-off"></i><div class="etitle">Yuklanmadi</div><div class="esub">${e.message}</div><button class="btn btn-sm btn-acc" style="margin-top:16px" onclick="loadProds()"><i class="ti ti-refresh"></i> Qayta</button></div>`;
  }
}

function getPrice(p){
  const pp=_pp.find(x=>x.sku===p.sku);
  // portal_price ustunligi: maxsus narx → standart chakana narx
  const base=pp?.portal_price||p.price_uzs||0;
  const disc=pp?.discount||0;
  const until=pp?.discount_until||"";
  const active=disc>0&&(!until||until>=_today);
  return{base,disc,until,active,final:active?Math.round(base*(1-disc/100)):base};
}

function setCat(cat,el){
  _cat=cat;
  document.querySelectorAll("#cchips .chip").forEach(c=>c.classList.remove("on"));
  if(el)el.classList.add("on");renderCatalog();
}

function buildCatChips(){
  const cats=[...new Set(_prods.map(p=>p.category).filter(Boolean))];
  const con=$("cchips");if(!con||!cats.length)return;
  cats.forEach(cat=>{
    const d=document.createElement("div");d.className="chip";d.textContent=cat;
    d.onclick=()=>setCat(cat,d);con.appendChild(d);
  });
}

function toggleView(){
  _viewList=!_viewList;
  const ico=$("vicon");
  if(ico)ico.className=_viewList?"ti ti-layout-grid":"ti ti-layout-list";
  renderCatalog();
}

function renderCatalog(){
  const q=($("psearch")||{value:""}).value.toLowerCase();
  const sort=($("psort")||{value:""}).value;
  const con=$("pgrid");if(!con)return;

  let list=_prods.filter(p=>{
    const pp=_pp.find(x=>x.sku===p.sku);
    if(pp&&pp.is_visible===false)return false;
    if(_cat==="chegirma")return getPrice(p).active;
    if(_cat&&p.category!==_cat)return false;
    if(q&&!(p.name||"").toLowerCase().includes(q))return false;
    return true;
  });

  if(sort==="asc")list.sort((a,b)=>getPrice(a).final-getPrice(b).final);
  else if(sort==="desc")list.sort((a,b)=>getPrice(b).final-getPrice(a).final);
  else if(sort==="az")list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","uz"));
  else if(sort==="stock")list.sort((a,b)=>(b.variants||[]).reduce((s,v)=>s+v.qty,0)-(a.variants||[]).reduce((s,v)=>s+v.qty,0));

  const cnt=$("pcnt");if(cnt)cnt.textContent=list.length+" ta tovar";

  if(!list.length){
    con.innerHTML=`<div class="empty"><i class="ti ti-mood-empty"></i><div class="etitle">${q?'"'+q+'" topilmadi':_cat==="chegirma"?"Chegirmali tovar yo'q":"Tovarlar yo'q"}</div></div>`;
    return;
  }

  if(_viewList){
    con.innerHTML=`<div class="pl">${list.map(p=>{
      const{base,active,disc,final}=getPrice(p);
      const qty=(p.variants||[]).reduce((a,v)=>a+(v.qty||0),0);
      const colors=[...new Set((p.variants||[]).map(v=>v.color).filter(Boolean))];
      return `<div class="plc" onclick="openProd('${p.sku}')">
        <div class="plimg">${p.image?`<img src="${p.image}" loading="lazy" alt="${p.name}">`:`<i class="ti ti-shoe" style="font-size:32px;color:#ddd"></i>`}</div>
        <div class="plinfo">
          <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
          <div style="display:flex;align-items:baseline;gap:5px;margin-bottom:5px">
            <span class="pprice" style="font-size:14px">${fmt(final)}</span><span style="font-size:11px;color:#ccc">so'm</span>
            ${active?`<span class="pold">${fmt(base)}</span><span style="font-size:10.5px;background:#FEE2E2;color:var(--red);padding:2px 6px;border-radius:5px;font-weight:700">−${disc}%</span>`:""}
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            ${colors.slice(0,5).map(c=>{const v=(p.variants||[]).find(x=>x.color===c);return`<div class="cdot" style="background:${v?.hex||'#888'}" title="${c}"></div>`;}).join("")}
            <span class="pstock ${qty===0?'out':''}" style="margin-left:auto">${qty>0?qty+" ta":"Tugagan"}</span>
          </div>
        </div>
      </div>`;
    }).join("")}</div>`;
  } else {
    con.innerHTML=`<div class="pg">${list.map(p=>{
      const{base,active,disc,final}=getPrice(p);
      const qty=(p.variants||[]).reduce((a,v)=>a+(v.qty||0),0);
      const colors=[...new Set((p.variants||[]).map(v=>v.color).filter(Boolean))];
      return `<div class="pc" onclick="openProd('${p.sku}')">
        ${active?`<div class="dbadge">−${disc}%</div>`:""}
        <div class="pimg">
          ${p.image?`<img src="${p.image}" alt="${p.name}" loading="lazy">`:`<i class="ti ti-shoe" style="font-size:44px;color:#ddd"></i>`}
          ${qty===0?`<div style="position:absolute;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center"><span style="background:rgba(0,0,0,.65);color:#fff;padding:5px 10px;border-radius:7px;font-size:11.5px;font-weight:700">Tugagan</span></div>`:""}
        </div>
        <div class="pinfo">
          <div class="pname">${p.name}</div>
          <div style="display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;margin-bottom:6px">
            <span class="pprice">${fmt(final)}</span>
            ${active?`<span class="pold">${fmt(base)}</span>`:""}
            <span style="font-size:11px;color:#ccc">so'm</span>
          </div>
          <div class="pmeta">
            <div style="display:flex;gap:3px;align-items:center">
              ${colors.slice(0,4).map(c=>{const v=(p.variants||[]).find(x=>x.color===c);return`<div class="cdot" title="${c}" style="background:${v?.hex||'#888'};width:14px;height:14px"></div>`;}).join("")}
              ${colors.length>4?`<span style="font-size:10px;color:#aaa">+${colors.length-4}</span>`:""}
            </div>
            <span class="pstock ${qty===0?'out':''}">${qty>0?qty+" ta":"0"}</span>
          </div>
        </div>
      </div>`;
    }).join("")}</div>`;
  }
}

// ── PRODUCT DETAIL ────────────────────────────
function openProd(sku){
  const p=_prods.find(x=>x.sku===sku);if(!p)return;
  const{base,active,disc,until,final}=getPrice(p);
  const totalQty=(p.variants||[]).reduce((a,v)=>a+(v.qty||0),0);
  const colors=[...new Set((p.variants||[]).map(v=>v.color).filter(Boolean))];
  const sizes=[...new Set((p.variants||[]).map(v=>v.size).filter(Boolean))].sort((a,b)=>{
    const n=v=>parseFloat(v);return isNaN(n(a))?a.localeCompare(b):n(a)-n(b);
  });
  _det={sku,color:colors[0]||"",size:"",qty:1};
  const el=$("dsbody");if(!el)return;

  // Variant jadval — rang×o'lcham zaxira
  const varRows=colors.length&&sizes.length ? colors.map(c=>{
    return`<tr><td style="font-weight:600">${c}</td>${sizes.map(s=>{
      const v=(p.variants||[]).find(x=>x.color===c&&x.size===s);
      const q=v?.qty||0;
      return`<td style="text-align:center;color:${q>0?"var(--dark)":"#ccc"};font-weight:${q>0?"700":"400"}">${q>0?q:"—"}</td>`;
    }).join("")}</tr>`;
  }).join("") : "";

  el.innerHTML=`
    <div style="position:relative;width:100%;aspect-ratio:1.3;border-radius:18px;overflow:hidden;background:#f0ede8;margin-bottom:16px">
      ${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover">`:`<div style="display:flex;align-items:center;justify-content:center;height:100%"><i class="ti ti-shoe" style="font-size:72px;color:#ddd"></i></div>`}
      ${active?`<div style="position:absolute;top:12px;left:12px;background:var(--red);color:#fff;font-size:13px;font-weight:800;padding:5px 12px;border-radius:10px">−${disc}%</div>`:""}
      ${totalQty===0?`<div style="position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center"><span style="background:rgba(0,0,0,.7);color:#fff;padding:10px 20px;border-radius:12px;font-weight:700">Tugagan</span></div>`:""}
      <button onclick="shareProd('${sku}')" style="position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.9);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15)">
        <i class="ti ti-share" style="font-size:17px;color:#555"></i>
      </button>
    </div>

    <div style="margin-bottom:6px">
      ${p.category?`<span class="badge bg-gray" style="margin-bottom:8px;display:inline-flex">${p.category}</span>`:""}
      <h3 style="font-size:21px;line-height:1.3">${p.name}</h3>
    </div>

    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:${active?'6px':'16px'}">
      <span style="font-size:28px;font-weight:800;color:${active?'var(--red)':'var(--acc)'};font-family:'Sora',sans-serif">${fmt(final)}</span>
      <span style="font-size:14px;color:#bbb">so'm</span>
      ${active?`<span style="font-size:15px;color:#ccc;text-decoration:line-through">${fmt(base)} so'm</span>`:""}
    </div>
    ${active?`<div style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--red);font-weight:700;margin-bottom:16px;padding:5px 10px;background:#FEF2F2;border-radius:8px"><i class="ti ti-clock"></i>${until?" "+until+" gacha":"Chegirma"}</div>`:""}

    <div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:18px;color:${totalQty>0?'var(--grn)':'var(--red)'}">
      <i class="ti ti-${totalQty>0?'circle-check':'circle-x'}"></i>
      ${totalQty>0?totalQty+" ta zaxirada":"Tugagan"}
    </div>

    ${colors.length?`
    <div class="slbl">Rang tanlang</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px" id="copts">
      ${colors.map(c=>{
        const v=(p.variants||[]).find(x=>x.color===c);
        const cqty=(p.variants||[]).filter(x=>x.color===c).reduce((a,x)=>a+x.qty,0);
        return`<div onclick="selColor('${c}',this)" class="btn btn-sm" style="gap:8px;border-width:2px;${c===_det.color?'border-color:var(--dark);background:#f0ede8':''}${cqty===0?';opacity:.35':''}">
          <div class="cdot" style="background:${v?.hex||'#888'}"></div>${c}${cqty>0?`<span style="font-size:10px;color:#aaa;margin-left:2px">${cqty}</span>`:""}
        </div>`;
      }).join("")}
    </div>`:""}

    ${sizes.length?`
    <div class="slbl">O'lcham tanlang</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px" id="sopts">
      ${sizes.map(s=>{
        const sqty=(p.variants||[]).filter(x=>x.size===s).reduce((a,x)=>a+x.qty,0);
        return`<div onclick="${sqty>0?`selSize('${s}',this)`:''}" class="sch ${sqty===0?'out':''}">
          <div style="text-align:center">${s}${sqty>0?`<div style="font-size:9px;color:#aaa;font-weight:600;margin-top:1px">${sqty}</div>`:""}</div>
        </div>`;
      }).join("")}
    </div>`:""}

    ${varRows?`
    <div class="slbl" style="cursor:pointer" onclick="toggleVT()">Zaxira jadvali <i class="ti ti-chevron-down" id="vtarrow"></i></div>
    <div id="vtable" style="display:none;margin-bottom:16px;overflow-x:auto">
      <table class="vtable">
        <thead><tr><th>Rang</th>${sizes.map(s=>`<th style="text-align:center">${s}</th>`).join("")}</tr></thead>
        <tbody>${varRows}</tbody>
      </table>
    </div>`:""}

    <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px">
      <span class="slbl" style="margin:0">Miqdor</span>
      <div class="qty"><button class="qbtn" onclick="detQty(-1)">−</button><span class="qnum" id="dqty">1</span><button class="qbtn" onclick="detQty(1)">+</button></div>
    </div>

    <div class="slbl">Izoh (ixtiyoriy)</div>
    <textarea id="dnote" rows="2" placeholder="Masalan: to'q rang kerak, yoki 41.5 o'lcham..." style="margin-bottom:16px;resize:none;font-size:13.5px"></textarea>

    <button class="btn btn-acc btn-block" style="padding:15px;font-size:15px;border-radius:16px" onclick="submitBron('${sku}')" id="bbtn" ${totalQty===0?'disabled style="opacity:.4"':''}>
      <i class="ti ti-bookmark-plus"></i> ${totalQty>0?"Bron qilish":"Tugagan"}
    </button>
    <button class="btn btn-block" style="margin-top:8px;padding:12px;border-radius:14px" onclick="closeSheet()">Yopish</button>
  `;

  $("dsheet").classList.add("on");
  document.body.style.overflow="hidden";
}

function toggleVT(){
  const t=$("vtable"),a=$("vtarrow");
  if(!t)return;
  const show=t.style.display==="none";
  t.style.display=show?"block":"none";
  if(a)a.className=show?"ti ti-chevron-up":"ti ti-chevron-down";
}

function selColor(color,el){
  _det.color=color;
  document.querySelectorAll("#copts .btn").forEach(d=>{d.style.borderColor="var(--brd)";d.style.background="";});
  el.style.borderColor="var(--dark)";el.style.background="#f0ede8";
}

function selSize(size,el){
  _det.size=size;
  document.querySelectorAll("#sopts .sch:not(.out)").forEach(d=>d.classList.remove("on"));
  el.classList.add("on");
}

function detQty(d){
  _det.qty=Math.max(1,(_det.qty||1)+d);
  if($("dqty"))$("dqty").textContent=_det.qty;
}

function closeSheet(){$("dsheet").classList.remove("on");document.body.style.overflow="";}

function shareProd(sku){
  const p=_prods.find(x=>x.sku===sku);if(!p)return;
  const txt=`${p.name} — ${fmt(getPrice(p).final)} so'm\n${location.href}`;
  if(navigator.share)navigator.share({title:p.name,text:txt,url:location.href});
  else{navigator.clipboard?.writeText(txt);toast("Nusxa olindi!");}
}

// ── BRON ─────────────────────────────────────
async function submitBron(sku){
  if(!_sess)return;
  const p=_prods.find(x=>x.sku===sku);if(!p)return;
  const sizes=[...new Set((p.variants||[]).map(v=>v.size).filter(Boolean))];
  if(sizes.length>0&&!_det.size){toast("O'lchamni tanlang","warn");return;}
  const note=($("dnote")||{value:""}).value.trim();
  const btn=$("bbtn");
  btn.innerHTML='<i class="ti ti-loader spin"></i> Yuborilmoqda...';btn.disabled=true;
  try{
    const{error}=await _sb.from("portal_bookings").insert({
      id:_sess.shopId+"_b_"+Date.now(),
      shop_id:_sess.shopId,customer_id:_sess.customerId,
      sku,product_name:p.name,
      color:_det.color||"",size:_det.size||"",qty:_det.qty||1,
      note:note||null,status:"kutilmoqda"
    });
    if(error)throw error;
    toast("✅ Bron qabul qilindi! Do'kon tasdiqlaydi.","grn");
    closeSheet();await loadBrons();updateBadges();goTab("bron");
  }catch(e){
    toast("Xato: "+e.message,"err");
    btn.innerHTML='<i class="ti ti-bookmark-plus"></i> Bron qilish';btn.disabled=false;
  }
}

async function loadBrons(){
  if(!_sess||!_sb)return;
  try{
    const{data}=await _sb.from("portal_bookings").select("*")
      .eq("shop_id",_sess.shopId).eq("customer_id",_sess.customerId)
      .order("created_at",{ascending:false}).limit(50);
    _brons=data||[];renderBrons();
  }catch(e){}
}

async function cancelBron(id){
  if(!confirm("Bronni bekor qilasizmi?"))return;
  try{
    await _sb.from("portal_bookings").update({status:"bekor"}).eq("id",id);
    toast("Bron bekor qilindi");await loadBrons();updateBadges();
  }catch(e){toast("Xato: "+e.message,"err");}
}

function setBF(f,el){
  _bf=f;
  document.querySelectorAll("#tab-bron .chip").forEach(c=>c.classList.remove("on"));
  if(el)el.classList.add("on");renderBrons();
}

function renderBrons(){
  const el=$("blist");if(!el)return;
  let list=_bf==="all"?_brons:_brons.filter(b=>b.status===_bf);
  if(!list.length){
    el.innerHTML=`<div class="empty"><i class="ti ti-bookmark-off"></i><div class="etitle">Bronlar yo'q</div><div class="esub">Katalogdan tovar bronlang</div></div>`;return;
  }
  const sLabel={kutilmoqda:"⏳ Kutilmoqda",tasdiqlandi:"✅ Tasdiqlandi",bekor:"❌ Bekor"};
  const sCls={kutilmoqda:"bg-yellow",tasdiqlandi:"bg-green",bekor:"bg-red"};
  const sBord={kutilmoqda:"#FDE68A",tasdiqlandi:"#BBF7D0",bekor:"#FECACA"};
  el.innerHTML=list.map(b=>`
    <div class="sc" style="border-left:4px solid ${sBord[b.status]||'var(--brd)'}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div style="font-weight:700;font-size:15px;flex:1;padding-right:8px">${b.product_name}</div>
        <span class="badge ${sCls[b.status]||'bg-yellow'}">${sLabel[b.status]||b.status}</span>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:#666;margin-bottom:${b.note?'8px':'4px'}">
        ${b.color?`<span><i class="ti ti-palette" style="font-size:12px;color:#bbb"></i> ${b.color}</span>`:""}
        ${b.size?`<span><i class="ti ti-ruler-2" style="font-size:12px;color:#bbb"></i> ${b.size}</span>`:""}
        <span><i class="ti ti-stack-2" style="font-size:12px;color:#bbb"></i> ${b.qty} ta</span>
      </div>
      ${b.note?`<div style="font-size:12.5px;color:#D97706;padding:7px 10px;background:#FEF3C7;border-radius:9px;margin-bottom:8px">💬 ${b.note}</div>`:""}
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:11.5px;color:#ccc">${(b.created_at||"").slice(0,16)}</div>
        ${b.status==="kutilmoqda"?`<button class="btn btn-sm btn-red" onclick="cancelBron('${b.id}')" style="padding:5px 10px;font-size:12px"><i class="ti ti-x"></i> Bekor</button>`:""}
      </div>
    </div>
  `).join("");
}

// ── TARIX ─────────────────────────────────────
async function loadSales(){
  if(!_sess||!_sb)return;
  try{
    const{data}=await _sb.from("sales").select("*")
      .eq("shop_id",_sess.shopId).eq("customer_id",_sess.customerId)
      .order("date",{ascending:false});
    _sales=data||[];renderTarix();renderQarz();
  }catch(e){}
}

function setTF(f,el){
  _tf=f;
  document.querySelectorAll("#tab-tarix .chip").forEach(c=>c.classList.remove("on"));
  if(el)el.classList.add("on");renderTarix();
}

function renderTarix(){
  const ke=$("tkpi"),le=$("tlist");if(!ke||!le)return;
  const tot=_sales.reduce((a,s)=>a+(s.total||0),0);
  const debt=_sales.filter(s=>s.remaining>0).reduce((a,s)=>a+(s.remaining||0),0);
  ke.innerHTML=`
    <div class="kpi"><div class="kval">${_sales.length}</div><div class="klbl">Xaridlar</div></div>
    <div class="kpi"><div class="kval" style="font-size:13px">${fmt(tot)}</div><div class="klbl">Jami so'm</div></div>
    <div class="kpi"><div class="kval" style="font-size:13px;color:${debt?'var(--red)':'var(--grn)'}">${fmt(debt)||"0"}</div><div class="klbl">Qarz</div></div>
  `;
  let list=_sales;
  if(_tf==="tolandi")list=_sales.filter(s=>!(s.remaining>0));
  else if(_tf==="qarz")list=_sales.filter(s=>s.remaining>0);

  if(!list.length){
    le.innerHTML=`<div class="empty"><i class="ti ti-receipt-off"></i><div class="etitle">Xarid yo'q</div></div>`;return;
  }
  le.innerHTML=list.map(s=>{
    const items=(s.items||[]).filter(Boolean);
    const isDebt=s.status==="qarz"&&s.remaining>0;
    return`<div class="sc" style="${isDebt?'border-left:4px solid var(--red)':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <div style="font-weight:800;font-size:17px;font-family:'Sora',sans-serif">${fmt(s.total)} so'm</div>
          <div style="font-size:12px;color:#aaa;margin-top:2px">${s.date||""} ${s.time||""}</div>
        </div>
        <span class="badge ${isDebt?'bg-red':s.status==='qaytarilgan'?'bg-orange':'bg-green'}">
          ${isDebt?"⏳ Qarzda":s.status==="qaytarilgan"?"↩ Qaytarilgan":"✅ To'langan"}
        </span>
      </div>
      ${items.length?`<div style="font-size:13px;color:#555;margin-bottom:${isDebt?'8px':'0'}">
        ${items.map(i=>`<span style="margin-right:8px">• ${i.name}${i.color?" ("+i.color+")":""} ×${i.qty}</span>`).join("")}
      </div>`:""}
      ${isDebt?`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#FEF2F2;border-radius:10px;margin-top:6px">
        <span style="font-size:13.5px;color:var(--red);font-weight:700"><i class="ti ti-credit-card"></i> ${fmt(s.remaining)} so'm qarz</span>
        ${s.due?`<span style="font-size:12px;color:#D97706;font-weight:600">${s.due}</span>`:""}
      </div>`:""}
    </div>`;
  }).join("");
}

// ── QARZ ─────────────────────────────────────
function renderQarz(){
  const el=$("qcont");if(!el)return;
  const debts=_sales.filter(s=>s.status==="qarz"&&s.remaining>0);
  const total=debts.reduce((a,s)=>a+(s.remaining||0),0);
  if(!debts.length){
    el.innerHTML=`<div class="empty" style="padding-top:60px"><div style="font-size:64px;margin-bottom:16px">🎉</div><div class="etitle" style="color:var(--grn);font-size:18px">Qarz yo'q!</div><div class="esub">Barcha to'lovlar amalga oshirilgan</div></div>`;return;
  }
  el.innerHTML=`
    <div class="dhero">
      <div style="font-size:11px;font-weight:800;opacity:.75;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Jami qarz</div>
      <div style="font-size:36px;font-weight:800;font-family:'Sora',sans-serif;margin-bottom:4px">${fmt(total)} so'm</div>
      <div style="font-size:13px;opacity:.7">${debts.length} ta to'lanmagan xarid</div>
    </div>
    <div class="slbl">Qarz tafsiloti</div>
    ${debts.map(s=>`
      <div class="sc" style="border-left:4px solid var(--red)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="font-size:13px;color:#888">${s.date||""}</div>
          <div style="font-weight:800;color:var(--red);font-size:17px;font-family:'Sora',sans-serif">${fmt(s.remaining)} so'm</div>
        </div>
        <div style="font-size:13px;color:#555;margin-bottom:${s.due?'8px':'0'}">
          ${(s.items||[]).filter(Boolean).map(i=>i.name).join(", ")||"—"}
        </div>
        ${s.due?`<div style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:#D97706;font-weight:700;padding:7px 10px;background:#FEF3C7;border-radius:9px">
          <i class="ti ti-clock"></i> To'lov muddati: ${s.due}
        </div>`:""}
      </div>
    `).join("")}
  `;
}

// ── TABS ──────────────────────────────────────
function goTab(name){
  ["bosh","katalog","tarix","bron","qarz","profil"].forEach(t=>{
    const tab=$(("tab-"+t));
    if(tab) tab.style.display=t===name?"block":"none";
    const n=$(("nav-"+t));if(n)n.classList.toggle("on",t===name);
  });
  if(name==="bosh")renderBosh();
  if(name==="tarix")renderTarix();
  if(name==="qarz")renderQarz();
  if(name==="profil")renderProfil();
  try{ document.querySelector(".main")?.scrollTo(0,0); window.scrollTo(0,0); }catch(e){}
}

function renderBosh(){
  const el=$("bosh-cont");if(!el||!_sess)return;
  const c=_sess;
  const nm=(c.customerName||"Mijoz").split(" ")[0];
  const pts=c.loyaltyPoints||0;

  // Qarz hisobi
  const debt=_sales.filter(s=>s.status==="qarz"&&s.remaining>0).reduce((a,s)=>a+(s.remaining||0),0);
  const debtCnt=_sales.filter(s=>s.status==="qarz"&&s.remaining>0).length;

  // Xarid statistikasi
  const totalSpent=_sales.reduce((a,s)=>a+(s.total||0),0);
  const buyCnt=_sales.length;

  // Kunlik salom
  const h=new Date().getHours();
  const salom=h<6?"Xayrli tun":h<12?"Xayrli tong":h<18?"Xayrli kun":"Xayrli oqshom";

  // Oxirgi xaridlar (2 ta)
  const lastSales=[..._sales].sort((a,b)=>((b.date||"")+(b.time||"")<(a.date||"")+(a.time||"")?-1:1)).slice(0,2);

  // Yangi tovarlar (oxirgi qo'shilgan, qoldig'i bor — 6 ta)
  const newProds=[..._prods]
    .filter(p=>(p.variants||[]).some(v=>(v.qty||0)>0))
    .sort((a,b)=>((b.created_at||"")<(a.created_at||"")?-1:1))
    .slice(0,6);

  // Kutilayotgan bronlar
  const pendingBrons=_brons.filter(b=>b.status==="kutilmoqda").length;

  el.innerHTML=`
    <!-- Salom + sodiqlik karta -->
    <div class="bosh-hero">
      <div class="bosh-hero-top">
        <div>
          <div class="bosh-salom">${salom},</div>
          <div class="bosh-name">${nm} 👋</div>
        </div>
        <div class="bosh-pts">
          <i class="ti ti-award"></i>
          <div>
            <div class="bosh-pts-val">${fmt(pts)}</div>
            <div class="bosh-pts-lbl">ball</div>
          </div>
        </div>
      </div>
    </div>

    ${debt>0?`
    <!-- Qarz ogohlantirish -->
    <div class="bosh-debt" onclick="goTab('qarz')">
      <div class="bosh-debt-l">
        <div class="bosh-debt-ico"><i class="ti ti-credit-card"></i></div>
        <div>
          <div class="bosh-debt-lbl">Jami qarzingiz</div>
          <div class="bosh-debt-val">${fmt(debt)} so'm</div>
          <div class="bosh-debt-sub">${debtCnt} ta xaridda</div>
        </div>
      </div>
      <i class="ti ti-chevron-right" style="font-size:20px;opacity:.5"></i>
    </div>`:`
    <div class="bosh-nodebt">
      <i class="ti ti-circle-check"></i> Qarzingiz yo'q — rahmat!
    </div>`}

    <!-- Statistika 2 karta -->
    <div class="bosh-stats">
      <div class="bosh-stat">
        <div class="bosh-stat-ico" style="background:#EFF6FF;color:#2563EB"><i class="ti ti-shopping-bag"></i></div>
        <div class="bosh-stat-val">${buyCnt}</div>
        <div class="bosh-stat-lbl">Xaridlar</div>
      </div>
      <div class="bosh-stat">
        <div class="bosh-stat-ico" style="background:#F0FDF4;color:#16A34A"><i class="ti ti-cash"></i></div>
        <div class="bosh-stat-val">${totalSpent>=1000000?(totalSpent/1000000).toFixed(1)+"M":fmt(totalSpent)}</div>
        <div class="bosh-stat-lbl">Jami xarid</div>
      </div>
    </div>

    <!-- Tez havolalar -->
    <div class="bosh-quick">
      <div class="bosh-q" onclick="goTab('katalog')">
        <div class="bosh-q-ico" style="background:#FEF3C7;color:#D97706"><i class="ti ti-shirt"></i></div>
        <span>Katalog</span>
      </div>
      <div class="bosh-q" onclick="goTab('bron')">
        <div class="bosh-q-ico" style="background:#EDE9FE;color:#7C3AED"><i class="ti ti-bookmark"></i></div>
        <span>Bronlar${pendingBrons>0?` (${pendingBrons})`:""}</span>
      </div>
      <div class="bosh-q" onclick="goTab('tarix')">
        <div class="bosh-q-ico" style="background:#DBEAFE;color:#2563EB"><i class="ti ti-receipt"></i></div>
        <span>Tarix</span>
      </div>
    </div>

    ${lastSales.length?`
    <!-- Oxirgi xaridlar -->
    <div class="bosh-sec">
      <div class="bosh-sec-head">
        <span>Oxirgi xaridlar</span>
        <a onclick="goTab('tarix')">Barchasi</a>
      </div>
      ${lastSales.map(s=>{
        const dt=(s.date||"").split("-").reverse().join(".");
        const isDebt=s.status==="qarz"&&s.remaining>0;
        return `<div class="bosh-sale">
          <div class="bosh-sale-l">
            <div class="bosh-sale-ico"><i class="ti ti-receipt-2"></i></div>
            <div>
              <div class="bosh-sale-num">${s.chek_num||"Chek"}</div>
              <div class="bosh-sale-dt">${dt}</div>
            </div>
          </div>
          <div class="bosh-sale-r">
            <div class="bosh-sale-tot">${fmt(s.total||0)} so'm</div>
            ${isDebt?`<div class="bosh-sale-debt">Qarz: ${fmt(s.remaining)}</div>`:`<div class="bosh-sale-paid">To'langan</div>`}
          </div>
        </div>`;
      }).join("")}
    </div>`:""}

    ${newProds.length?`
    <!-- Yangi tovarlar -->
    <div class="bosh-sec">
      <div class="bosh-sec-head">
        <span>Yangi tovarlar</span>
        <a onclick="goTab('katalog')">Barchasi</a>
      </div>
      <div class="bosh-newgrid">
        ${newProds.map(p=>{
          const img=(p.color_images&&Object.values(p.color_images)[0])||p.image||"";
          const price=getPrice(p);
          return `<div class="bosh-new" onclick="goTab('katalog')">
            <div class="bosh-new-img">${img?`<img src="${img}" loading="lazy">`:`<i class="ti ti-photo"></i>`}</div>
            <div class="bosh-new-name">${p.name||""}</div>
            <div class="bosh-new-price">${fmt(price)} so'm</div>
          </div>`;
        }).join("")}
      </div>
    </div>`:""}

    <div style="height:20px"></div>
  `;
}

function renderProfil(){
  const el=$("profcont");if(!el||!_sess)return;
  const c=_sess;
  const tots=_sales.reduce((a,s)=>a+(s.total||0),0);
  const cnt=_sales.length;
  const pts=c.loyaltyPoints||0;
  const loyRate=c.loyaltyRate||0; // do'kon sozlamasidan

  // Tug'ilgan kun
  let bdayHtml="";
  if(c.birthday){
    const[,m,d]=c.birthday.split("-");
    const months=["","Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];
    const today=new Date();
    const diff=Math.round((new Date(today.getFullYear(),+m-1,+d)-today)/86400000);
    const soon=diff>=0&&diff<=7;
    bdayHtml=`<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;
      background:${soon?"#FEF3C7":"var(--bg)"};border-radius:12px;border:1.5px solid ${soon?"#FCD34D":"var(--brd)"};margin-bottom:12px">
      <span style="font-size:24px">🎂</span>
      <div>
        <div style="font-size:12px;color:#888;font-weight:600">Tug'ilgan kun</div>
        <div style="font-size:15px;font-weight:700">${d} ${months[+m]}${soon?` <span style="color:#D97706">(${diff===0?"Bugun!":diff+" kun qoldi"})</span>`:""}
        </div>
      </div>
    </div>`;
  }

  // Sodiqlik ballari
  let balsHtml="";
  if(pts>0||loyRate>0){
    balsHtml=`<div style="padding:16px;background:linear-gradient(135deg,#0D1B2A,#1a3050);border-radius:16px;color:#fff;margin-bottom:16px;text-align:center">
      <div style="font-size:28px;margin-bottom:4px">⭐</div>
      <div style="font-size:36px;font-weight:800;font-family:'Sora',sans-serif">${pts}</div>
      <div style="font-size:13px;opacity:.7;margin-top:4px">sodiqlik balli</div>
      ${loyRate>0?`<div style="margin-top:8px;font-size:12px;opacity:.6">Har ${fmt(loyRate)} so'm xaridda 1 ball</div>`:""}
    </div>`;
  }

  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--brd)">
      <div style="width:56px;height:56px;border-radius:16px;background:#0D1B2A;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="ti ti-user" style="color:#E9A500;font-size:26px"></i>
      </div>
      <div>
        <div style="font-size:20px;font-weight:800">${c.customerName||"Mijoz"}</div>
        <div style="font-size:13px;color:#888;margin-top:2px">${c.phone||""}</div>
      </div>
    </div>

    ${balsHtml}
    ${bdayHtml}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
      <div style="padding:14px;background:var(--bg);border-radius:12px;text-align:center;border:1px solid var(--brd)">
        <div style="font-size:26px;font-weight:800;font-family:'Sora',sans-serif">${cnt}</div>
        <div style="font-size:12px;color:#888;margin-top:3px">Jami xarid</div>
      </div>
      <div style="padding:14px;background:var(--bg);border-radius:12px;text-align:center;border:1px solid var(--brd)">
        <div style="font-size:16px;font-weight:800;font-family:'Sora',sans-serif">${fmt(tots)}</div>
        <div style="font-size:11px;color:#888;margin-top:3px">Jami summa (so'm)</div>
      </div>
    </div>

    <button onclick="logout()" style="width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--brd);background:#fff;
      color:#888;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">
      <i class="ti ti-logout"></i> Chiqish
    </button>
  `;
}

// ── PULL TO REFRESH ───────────────────────────
let _pst=0;
document.addEventListener("touchstart",e=>{_pst=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",async e=>{
  if(e.changedTouches[0].clientY-_pst>80&&window.scrollY===0){
    toast("Yangilanmoqda...","");
    await Promise.all([loadProds(),loadSales(),loadBrons()]);
    updateBadges();toast("Yangilandi","grn");
  }
},{passive:true});

init();
</script>
</body>
</html>
