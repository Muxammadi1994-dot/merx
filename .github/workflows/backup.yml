name: Supabase Kunlik Zaxira

on:
  schedule:
    # ✅ A4 (2026-09-18): kuniga 3 marta — O'zbekiston vaqti 05:00, 12:00, 19:00
    # (UTC 00:00, 07:00, 14:00). Yo'qotish oynasi 24 soatdan ~7 soatga tushadi.
    - cron: '0 0,7,14 * * *'
  workflow_dispatch:
    # Qo'lda ham ishga tushirish mumkin (GitHub → Actions → Run workflow)

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Zaxira papkasini yaratish
        run: mkdir -p backup

      - name: Jadvallarni CSV formatda yuklab olish (sahifalab, chegarasiz)
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          DATE=$(date +%Y-%m-%d_%H%M)
          # ✅ A4: 4 jadval qo'shildi — chiqimlar, audit_log, deleted_records, device_logs
          TABLES="products sales customers staff ombor xarajatlar debt_payments returns shifts suppliers settings shops chiqimlar audit_log deleted_records device_logs"
          PAGE=1000
          SUMMARY=""

          for TABLE in $TABLES; do
            OUT="backup/${DATE}_${TABLE}.csv"
            : > "$OUT"
            OFFSET=0
            TOTAL=""
            while true; do
              # ✅ A4-b (2026-09-19): sahifa oxiri `Content-Range` SARLAVHASIDAN
              # aniqlanadi (masalan `0-999/10234`), qator sanashdan EMAS.
              # Sabab: oxirgi qatorda yangi qator belgisi yo'q — `wc -l` 1 000 ni
              # 999 deb sanardi va sahifalash birinchi sahifadayoq to'xtardi
              # (19-sen jonli: sales/products/customers/ombor 999 da qolgan).
              # Sarlavha aniq son beradi va matn ichidagi yangi qatorlardan
              # ta'sirlanmaydi.
              PAGE_FILE=$(mktemp); HDR_FILE=$(mktemp)
              END=$(( OFFSET + PAGE - 1 ))
              HTTP=$(curl -s -w "%{http_code}" -D "$HDR_FILE" \
                -H "apikey: $SB_KEY" \
                -H "Authorization: Bearer $SB_KEY" \
                -H "Accept: text/csv" \
                -H "Range-Unit: items" \
                -H "Range: ${OFFSET}-${END}" \
                -H "Prefer: count=exact" \
                "$SB_URL/rest/v1/$TABLE?select=*" \
                -o "$PAGE_FILE")
              if [ "$HTTP" != "200" ] && [ "$HTTP" != "206" ]; then
                echo "❌ $TABLE: HTTP $HTTP (offset $OFFSET)"; head -c 300 "$PAGE_FILE"; echo
                rm -f "$PAGE_FILE" "$HDR_FILE"; exit 1
              fi
              CR=$(grep -i '^content-range:' "$HDR_FILE" | tr -d '\r' | awk '{print $2}')
              if [ -z "$CR" ]; then
                echo "❌ $TABLE: Content-Range sarlavhasi yo'q — zaxira ishonchsiz"
                rm -f "$PAGE_FILE" "$HDR_FILE"; exit 1
              fi
              TOTAL=${CR#*/}
              if [ "$OFFSET" -eq 0 ]; then
                cat "$PAGE_FILE" >> "$OUT"                # birinchi sahifa: sarlavha bilan
              else
                tail -n +2 "$PAGE_FILE" >> "$OUT"         # keyingilari: sarlavhasiz
              fi
              # oxirgi qatorda yangi qator belgisi bo'lmasligi mumkin — qo'shamiz
              [ -s "$OUT" ] && [ "$(tail -c 1 "$OUT" | wc -l)" -eq 0 ] && echo "" >> "$OUT"
              rm -f "$PAGE_FILE" "$HDR_FILE"
              OFFSET=$(( OFFSET + PAGE ))
              if [ "$TOTAL" = "*" ] || [ "$OFFSET" -ge "$TOTAL" ]; then break; fi
            done
            echo "✅ $TABLE: $TOTAL qator (serverdan)"
            SUMMARY="${SUMMARY}${TABLE}=${TOTAL} "
          done
          echo "$SUMMARY" > backup/_jami.txt

      - name: Zaxira natijasini tekshirish
        run: |
          echo "=== Zaxira fayllari ==="
          ls -lh backup/
          echo "=== Jami hajm ==="
          du -sh backup/
          echo "=== Serverdagi qator sonlari ==="
          cat backup/_jami.txt | tr ' ' '\n' | grep -v '^$'
          echo "=== Fayldagi qator sonlari (taxminiy — matn ichida yangi qator bo'lishi mumkin) ==="
          for f in backup/*.csv; do
            n=$(( $(grep -c '' "$f") - 1 )); [ "$n" -lt 0 ] && n=0
            printf "%-45s %8d\n" "$(basename "$f")" "$n"
          done

      - name: Zaxirani GitHub'ga saqlash (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: merx-backup-${{ github.run_number }}-${{ github.run_id }}
          path: backup/
          retention-days: 30
